version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - dotnet tool install -g Amazon.Lambda.Tools
      - export PATH="$PATH:/root/.dotnet/tools"
  pre_build:
    commands:
      - echo "Building ImageProcessing service"
      - dotnet --version
  build:
    commands:
      - cd ImageProcessing/src/ImageProcessing
      - dotnet lambda deploy-function ImageProcessingSvc --function-architecture x86_64 --region $AWS_DEFAULT_REGION
  post_build:
    commands:
      - echo "ImageProcessingSvc deployment completed"